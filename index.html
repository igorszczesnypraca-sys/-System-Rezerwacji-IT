<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logowanie - System IT</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-page">
    <div class="login-box">
        <h1>System Rezerwacji IT</h1>
        <form id="loginForm">
            <div class="form-group">
                <label>Login</label>
                <input type="text" id="username" placeholder="admin lub user" required>
            </div>
            <div class="form-group">
                <label>Hasło</label>
                <input type="password" id="password" placeholder="admin lub user" required>
            </div>
            <button type="button" class="btn btn-primary" onclick="checkLogin()">Zaloguj się</button>
            <p id="error" style="color:red; margin-top:10px; display:none;">Błędny login lub hasło!</p>
        </form>
    </div>
    <script>
        function checkLogin() {
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            if(user === 'admin' && pass === 'admin') {
                localStorage.setItem('userRole', 'admin');
                window.location.href = 'dashboard.html';
            } else if(user === 'user' && pass === 'user') {
                localStorage.setItem('userRole', 'user');
                window.location.href = 'dashboard.html';
            } else {
                document.getElementById('error').style.display = 'block';
            }
        }
    </script>
</body>
</html>
